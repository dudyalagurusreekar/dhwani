# ==============================================================================
# Dhwani / EchoShield AI — Reference Deployment Topology Specification
# NOTE: This file is a REFERENCE configuration for containerized multi-service deployment.
# Production deployments must provision real TLS certificates, secret management
# (e.g. Vault / AWS Secrets Manager), and an ingress authentication gateway.
# ==============================================================================

version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy & Perimeter TLS Gateway (Publicly Exposed: 80 / 443)
  # ----------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:alpine
    container_name: dhwani-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/certs:ro
      - ./private:/etc/ssl/private:ro
    depends_on:
      - frontend
      - backend
    networks:
      - dhwani-net

  # ----------------------------------------------------------------------------
  # 2. Next.js Frontend & BFF Proxy (Internal: Port 3000)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: dhwani-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DHWANI_BACKEND_URL=http://backend:8000
      - DHWANI_API_KEY=${DHWANI_API_KEY} # Server-side only: never prefixed with NEXT_PUBLIC_
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - dhwani-net

  # ----------------------------------------------------------------------------
  # 3. FastAPI Deep Inference & Risk Fusion Engine (Internal: Port 8000)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dhwani-backend
    restart: unless-stopped
    environment:
      - DHWANI_AUTH_REQUIRED=true
      - DHWANI_API_KEY=${DHWANI_API_KEY}
      - ALLOWED_ORIGINS=https://dhwani.enterprise.internal,http://frontend:3000
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_VERIFY_SIGNATURE=true
      - TWILIO_PUBLIC_URL=https://dhwani.enterprise.internal/twilio/voice
      - TWILIO_STREAM_PUBLIC_URL=wss://dhwani.enterprise.internal/twilio/media
      - MAX_UPLOAD_SIZE_BYTES=26214400
    expose:
      - "8000"
    volumes:
      - ../data:/app/data
      - ../models:/app/models:ro
    networks:
      - dhwani-net

networks:
  dhwani-net:
    driver: bridge
