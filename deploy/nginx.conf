# ==============================================================================
# Dhwani / EchoShield AI — Enterprise Production Reverse Proxy Configuration
# ==============================================================================
# Architecture:
# - Terminate public TLS (HTTPS/WSS) on ports 80/443
# - Route Next.js Frontend / BFF traffic to frontend:3000
# - Route WebSocket telemetry (/ws/) to backend:8000 with connection upgrade
# - Inject internal X-API-Key at perimeter for authorized WebSocket streams
# - Route Twilio webhooks (/twilio/) to backend:8000
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Rate limiting zone for API requests (100 req/sec per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # Upstream Services (isolated in private docker network)
    upstream frontend_upstream {
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Production HTTPS / WSS Server
    server {
        listen 443 ssl http2;
        server_name dhwani.enterprise.internal;

        # TLS Hardening (TLS 1.2 and 1.3 only)
        ssl_certificate     /etc/ssl/certs/dhwani.crt;
        ssl_certificate_key /etc/ssl/private/dhwani.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ----------------------------------------------------------------------
        # 1. Next.js Frontend & BFF Routes (default root)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # 2. WebSocket Telemetry & Audio Streams (/ws/)
        # ----------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            # WebSocket Handshake Upgrade Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Client Identity Forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Strip client-forged internal trust headers
            proxy_set_header X-Internal-Caller "";
            proxy_set_header X-Internal-Service "";

            # Pass client credentials through to backend validation
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

            # TRUST BOUNDARY & DEPLOYMENT ARCHITECTURE:
            # - Model A (Controlled Demo Environment):
            #   Backend permits unauthenticated read-only dashboard telemetry (DHWANI_AUTH_REQUIRED=false).
            # - Model B (Enterprise Production):
            #   Perimeter authentication gateway (e.g. auth_request / OAuth2-Proxy / mTLS) terminates
            #   user session at Nginx before forwarding. Anonymous clients lacking valid subprotocol
            #   or gateway authentication fail closed at FastAPI with close code 1008.

            # Streaming Timeouts (prevent premature socket termination)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ----------------------------------------------------------------------
        # 3. Twilio Telephony Webhook & Media Streams (/twilio/)
        # ----------------------------------------------------------------------
        location /twilio/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            # Support bidirectional Twilio media streams
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }

        # ----------------------------------------------------------------------
        # 4. Direct Public Health & Readiness Probes
        # ----------------------------------------------------------------------
        location /health {
            proxy_pass http://backend_upstream/health;
            proxy_set_header Host $host;
            proxy_read_timeout 5s;
        }
    }
}
